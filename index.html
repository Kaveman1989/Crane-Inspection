<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2E4759"><link rel="manifest" href="manifest.json"><title>Crane Inspection — Secure Portal</title><style>
:root{--paper:#f3f0e8;--ink:#23262b;--steel:#2e4759;--amber:#cc7a1e;--safe:#1f7a46;--line:#dad5c7;--card:#fffdf8;--muted:#726c5e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:560px;margin:8vh auto;padding:20px}.brand{background:var(--steel);color:white;border-radius:20px 20px 8px 8px;padding:26px;box-shadow:0 8px 24px #0002}.brand h1{margin:0 0 6px;font-size:28px}.brand p{margin:0;opacity:.82}.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 16px #0000000c}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role{border:2px solid var(--line);border-radius:14px;background:#fff;padding:18px;text-align:left;cursor:pointer}.role:hover{border-color:var(--steel)}.role b{display:block;font-size:17px;margin-bottom:5px}.role span{font-size:12px;color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font:inherit}button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:var(--steel);color:white;font-weight:700;font-size:14px;cursor:pointer}.secondary{background:#e9e5da;color:var(--ink)}.status{font-size:12px;color:var(--muted);margin-top:10px}.hidden{display:none}@media(max-width:480px){.role-grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="brand"><h1>Crane Inspection</h1><p>Field operations & executive management portal</p></section><section class="card" id="choice"><h2>Choose your workspace</h2><div class="role-grid"><button class="role" id="operatorChoice"><b>Operator</b><span>Assigned cranes, daily inspections and sign-off</span></button><button class="role" id="execChoice"><b>Executive / Manager</b><span>All cranes, reports, assignments and management dashboard</span></button></div><p class="status">Secure login is powered by Supabase when configured. Until then this build opens in demo mode.</p></section><section class="card hidden" id="login"><h2 id="loginTitle">Sign in</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Sign in</button><button class="secondary" id="backBtn">Back</button><p class="status" id="loginStatus"></p></section></main><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth.js"></script><script>
let role='operator';const $=id=>document.getElementById(id);$('operatorChoice').onclick=()=>showLogin('operator');$('execChoice').onclick=()=>showLogin('executive');$('backBtn').onclick=()=>{$('login').classList.add('hidden');$('choice').classList.remove('hidden')};function showLogin(r){role=r;$('choice').classList.add('hidden');$('login').classList.remove('hidden');$('loginTitle').textContent=r==='executive'?'Executive / Manager Sign In':'Operator Sign In';$('loginStatus').textContent=window.craneAuthReady?'':'Demo mode: no Supabase credentials configured.'}
$('loginBtn').onclick=async()=>{if(!window.craneAuthReady){location.href=rout(role);return}const email=$('email').value.trim(),password=$('password').value; $('loginStatus').textContent='Signing in…';const {error}=await window.craneSupabase.auth.signInWithPassword({email,password});if(error){$('loginStatus').textContent=error.message;return}const {data:{session}}=await window.craneSupabase.auth.getSession();const {data:profile}=await window.craneSupabase.from('profiles').select('role,active').eq('id',session.user.id).single();if(!profile||!profile.active||profile.role!==role){await window.craneSupabase.auth.signOut();$('loginStatus').textContent='This account is not assigned to that workspace.';return}location.href=rout(role)};function rout(r){return r==='executive'?'./executive.html':'./operator.html'}
</script></body></html>
